<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulse Framework - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pulse Framework - A modular, scalable, and TypeScript-native load testing framework powered by K6">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Premium Dark Theme stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Premium Indigo and Slate Aesthetics matching the Cockpit Desktop Dashboard */
      --theme-color: #818cf8;
      --base-font-family: 'Outfit', sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
      --base-background-color: #070913;
      --sidebar-background-color: rgba(11, 15, 30, 0.65);
      --sidebar-border-color: rgba(255, 255, 255, 0.06);
      --link-color: #94a3b8;
      --link-color--hover: #f1f5f9;
      --heading-color: #f1f5f9;
      --base-color: #94a3b8;
      --code-inline-background-color: rgba(129, 140, 248, 0.08);
      --code-inline-color: #a5b4fc;
      --code-theme-background: #0b0f1e;
      --sidebar-width: 270px;
    }
    
    /* Global Styles */
    body {
      background-color: #070913 !important;
      font-family: 'Outfit', sans-serif !important;
      color: #f1f5f9 !important;
    }

    /* Sidebar Wrapper with Cockpit glassmorphism */
    .sidebar {
      background: rgba(11, 15, 30, 0.85) !important;
      backdrop-filter: blur(25px) !important;
      -webkit-backdrop-filter: blur(25px) !important;
      border-right: 1px solid rgba(255, 255, 255, 0.06) !important;
      padding: 2.5rem 1.25rem !important;
      width: var(--sidebar-width) !important;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5) !important;
    }
    
    /* Align page content with the custom sidebar width */
    .content {
      left: var(--sidebar-width) !important;
    }
    body.close .content {
      left: 0 !important;
    }
    body.close .sidebar {
      transform: translateX(calc(-1 * var(--sidebar-width))) !important;
    }

    /* Brand Logo Style for the App Title */
    .sidebar h1 {
      margin: 0 0 2.5rem 0 !important;
      padding: 0 0 1.25rem 0 !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06) !important;
      font-size: 1.2rem !important;
      font-weight: 800 !important;
      letter-spacing: 0.5px !important;
      text-align: left !important;
    }
    
    .sidebar h1 .app-name-link {
      background: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%) !important;
      -webkit-background-clip: text !important;
      -webkit-text-fill-color: transparent !important;
      text-decoration: none !important;
      font-weight: 800 !important;
    }

    /* Sidebar Custom Search Bar Overrides */
    .sidebar .search input {
      background-color: rgba(255, 255, 255, 0.03) !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      border-radius: 10px !important;
      color: #f1f5f9 !important;
      padding: 0.75rem 1rem 0.75rem 2.25rem !important;
      font-family: 'Outfit', sans-serif !important;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    .sidebar .search input:focus {
      border-color: #818cf8 !important;
      box-shadow: 0 0 15px rgba(129, 140, 248, 0.25) !important;
      background-color: rgba(255, 255, 255, 0.05) !important;
    }

    /* Sidebar Section Group Headers */
    .sidebar-nav strong {
      display: block;
      font-size: 0.75rem !important;
      font-weight: 700 !important;
      text-transform: uppercase !important;
      letter-spacing: 1.5px !important;
      color: #94a3b8 !important;
      opacity: 0.5;
      margin: 2rem 0 0.75rem 0.5rem !important;
    }

    /* Sidebar Navigation Links */
    .sidebar-nav ul {
      list-style-type: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .sidebar-nav li {
      margin: 6px 0 !important;
    }

    .sidebar-nav a {
      display: flex !important;
      align-items: center !important;
      padding: 0.65rem 0.85rem !important;
      color: #94a3b8 !important;
      font-size: 0.9rem !important;
      font-weight: 500 !important;
      text-decoration: none !important;
      border-radius: 8px !important;
      border-left: 3px solid transparent !important;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1) !important;
    }

    /* Hover effect matching GUI's secondary elements */
    .sidebar-nav a:hover {
      background: rgba(255, 255, 255, 0.05) !important;
      color: #f1f5f9 !important;
      padding-left: 1.1rem !important;
    }

    /* Active link style matching Cockpit's primary purple active items */
    .sidebar-nav li.active > a, 
    .sidebar-nav a.active {
      background: linear-gradient(135deg, rgba(129, 140, 248, 0.15) 0%, rgba(79, 70, 229, 0.03) 100%) !important;
      color: #a5b4fc !important;
      font-weight: 600 !important;
      border-left: 3px solid #818cf8 !important;
      box-shadow: inset 0 0 12px rgba(129, 140, 248, 0.05) !important;
    }

    /* Sub-sidebar for page section headings (TOC) */
    .sidebar-nav ul.app-sub-sidebar {
      padding-left: 1.25rem !important;
      margin: 0.25rem 0 0.5rem 0.25rem !important;
      border-left: 1px solid rgba(255, 255, 255, 0.06) !important;
    }

    .sidebar-nav ul.app-sub-sidebar li {
      margin: 4px 0 !important;
    }

    .sidebar-nav ul.app-sub-sidebar a {
      font-size: 0.8rem !important;
      padding: 0.35rem 0.6rem !important;
      color: #64748b !important;
      background: none !important;
      border-left: none !important;
      box-shadow: none !important;
      font-weight: 400 !important;
    }

    /* Sub-sidebar hover and active states overrides */
    .sidebar-nav ul.app-sub-sidebar a:hover {
      color: #f1f5f9 !important;
      background: rgba(255, 255, 255, 0.02) !important;
      padding-left: 0.75rem !important;
      border-radius: 6px !important;
    }

    .sidebar-nav ul.app-sub-sidebar a.active {
      color: #818cf8 !important;
      font-weight: 600 !important;
      background: none !important;
      border-left: none !important;
      box-shadow: none !important;
    }

    /* Markdown styling tweaks for visual excellence */
    .markdown-section pre {
      background-color: #0b0f1e !important;
      border-radius: 12px !important;
      border: 1px solid rgba(255, 255, 255, 0.06) !important;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.35) !important;
    }

    .markdown-section code {
      font-family: 'JetBrains Mono', monospace !important;
    }

    .markdown-section p code, .markdown-section li code {
      background: rgba(129, 140, 248, 0.1) !important;
      color: #a5b4fc !important;
      padding: 0.2rem 0.4rem !important;
      border-radius: 4px !important;
    }

    .markdown-section a {
      color: #818cf8 !important;
      text-decoration: none !important;
      border-bottom: 1px dashed rgba(129, 140, 248, 0.4) !important;
      transition: all 0.2s ease !important;
    }

    .markdown-section a:hover {
      color: #a5b4fc !important;
      border-bottom-style: solid !important;
    }

    /* Premium custom scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070913;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(129, 140, 248, 0.3);
    }
  </style>
</head>
<body>
  <div id="app">Loading Pulse Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Pulse Framework',
      repo: 'oaugustoreis/pulse',
      loadSidebar: false,
      coverpage: false,
      autoHeader: false,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found!',
        depth: 6
      }
    }
  </script>
  
  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
