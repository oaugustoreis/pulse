<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pulse Framework - Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Pulse Framework - A modular, scalable, and TypeScript-native load testing framework powered by K6">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- Premium Dark Theme stylesheet -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple-dark.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Premium Indigo and Slate Aesthetics matching the Cockpit Desktop Dashboard */
      --theme-color: #818cf8;
      --base-font-family: 'Outfit', sans-serif;
      --code-font-family: 'JetBrains Mono', monospace;
      --base-background-color: #0b0f19;
      --sidebar-background-color: #0e1322;
      --sidebar-border-color: rgba(129, 140, 248, 0.1);
      --link-color: #818cf8;
      --link-color--hover: #a5b4fc;
      --heading-color: #f3f4f6;
      --base-color: #9ca3af;
      --code-inline-background-color: rgba(129, 140, 248, 0.1);
      --code-inline-color: #a5b4fc;
      --code-theme-background: #0e1322;
    }

    .sidebar {
      border-right: 1px solid var(--sidebar-border-color);
    }

    .markdown-section pre {
      border-radius: 8px !important;
      border: 1px solid rgba(129, 140, 248, 0.1) !important;
    }
  </style>
</head>
<body>
  <div id="app">Loading Pulse Documentation...</div>
  <script>
    window.$docsify = {
      name: 'Pulse Framework',
      repo: 'oaugustoreis/pulse',
      loadSidebar: false,
      coverpage: false,
      autoHeader: false,
      subMaxLevel: 3,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found!',
        depth: 6
      }
    }
  </script>

  <!-- Docsify Core and Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
</body>
</html>
